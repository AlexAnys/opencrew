<?xml version="1.0" encoding="UTF-8"?>
<svg width="1360" height="1200" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #FAFAF8;">

<style>
  text { fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .leader { stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 3 3; fill: none; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-brown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="th" x="340" y="22" text-anchor="middle" font-size="16">OpenCrew A2A v2</text>

<!-- 用户 -->
<rect x="40" y="42" width="86" height="34" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="83" y="63" text-anchor="middle">用户</text>
<line x1="83" y1="76" x2="83" y2="94" class="arr" marker-end="url(#arrow)"/>

<!-- Slack 工作区 -->
<rect x="40" y="96" width="600" height="138" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" fill-opacity="0.5"/>

<!-- OpenClaw App -->
<rect x="52" y="104" width="396" height="82" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" fill-opacity="0.6"/>
<text class="ts" x="250" y="118" text-anchor="middle" fill="#185FA5">OpenClaw App — 一个 bot · 多频道 · 各司其职</text>

<rect x="62" y="128" width="88" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="106" y="148" text-anchor="middle" fill="#3C3489">#hq</text>
<text class="ts" x="106" y="164" text-anchor="middle" fill="#534AB7">幕僚长</text>

<rect x="158" y="128" width="88" height="48" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="202" y="148" text-anchor="middle" fill="#0C447C">#cto</text>
<text class="ts" x="202" y="164" text-anchor="middle" fill="#185FA5">CTO</text>

<rect x="254" y="128" width="88" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="298" y="148" text-anchor="middle" fill="#085041">#build</text>
<text class="ts" x="298" y="164" text-anchor="middle" fill="#0F6E56">执行者</text>

<rect x="350" y="128" width="88" height="48" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="394" y="148" text-anchor="middle" fill="#712B13">#cio</text>
<text class="ts" x="394" y="164" text-anchor="middle" fill="#993C1D">领域专家</text>

<!-- 编排者 -->
<rect x="470" y="104" width="158" height="82" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="549" y="122" text-anchor="middle" fill="#633806">编排者</text>
<text class="ts" x="549" y="140" text-anchor="middle" fill="#854F0B">独立 Slack App</text>
<text class="ts" x="549" y="156" text-anchor="middle" fill="#854F0B">规划 + QC</text>
<text class="ts" x="549" y="172" text-anchor="middle" fill="#854F0B">例：幕僚长 / CTO</text>

<path d="M470 170 L298 170 L298 176" fill="none" stroke="#854F0B" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow-brown)"/>
<text x="384" y="180" text-anchor="middle" fill="#854F0B" style="font-size:10px">@拉入任意执行频道</text>

<text class="ts" x="250" y="210" text-anchor="middle">不变：一个 bot 多角色</text>
<text class="ts" x="549" y="210" text-anchor="middle" fill="#854F0B">V2 新增</text>

<!-- 分隔 -->
<line x1="60" y1="228" x2="620" y2="228" stroke="#B4B2A9" stroke-width="0.3" stroke-dasharray="3 3"/>
<text class="ts" x="340" y="248" text-anchor="middle">频道内 Harness Loop</text>

<!-- 用户触发 -->
<rect x="56" y="264" width="130" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
