<text class="ts" x="121" y="298" text-anchor="middle">需求 / @编排者接手</text>
<line x1="186" y1="288" x2="216" y2="288" class="arr" marker-end="url(#arrow)"/>

<rect x="218" y="264" width="120" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="278" y="282" text-anchor="middle" fill="#633806">编排者</text>
<text class="ts" x="278" y="298" text-anchor="middle" fill="#854F0B">规划 + 标准</text>
<line x1="338" y1="288" x2="368" y2="288" class="arr" marker-end="url(#arrow)"/>

<rect x="370" y="264" width="120" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="430" y="282" text-anchor="middle" fill="#085041">执行者</text>
<text class="ts" x="430" y="298" text-anchor="middle" fill="#0F6E56">基于文件工作</text>

<rect x="516" y="268" width="76" height="40" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
