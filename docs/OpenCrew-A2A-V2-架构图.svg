<line x1="490" y1="288" x2="514" y2="288" class="leader"/>

<line x1="430" y1="312" x2="430" y2="340" class="arr" marker-end="url(#arrow)"/>

<rect x="370" y="342" width="120" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="430" y="360" text-anchor="middle" fill="#633806">编排者</text>
<text class="ts" x="430" y="376" text-anchor="middle" fill="#854F0B">质量检查</text>

<path d="M370 366 L340 366 L340 318 Q340 312 346 312 L368 312" fill="none" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arrow-brown)"/>
<text x="326" y="344" text-anchor="end" fill="#854F0B" style="font-size:10px">返工</text>

<rect x="210" y="256" width="290" height="144" rx="10" fill="none" stroke="#854F0B" stroke-width="0.7" stroke-dasharray="6 4" opacity="0.3"/>
<text x="355" y="410" text-anchor="middle" fill="#854F0B" style="font-size:10px">Harness Loop · 循环至达成一致</text>

<line x1="430" y1="390" x2="430" y2="428" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="442" y="414">通过</text>
<rect x="390" y="430" width="80" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="430" y="452" text-anchor="middle" fill="#444441">@用户</text>

<rect x="50" y="330" width="3" height="70" rx="1.5" fill="#854F0B" opacity="0.2"/>
<text x="44" y="366" text-anchor="end" fill="#854F0B" style="font-size:9px" transform="rotate(-90 44 366)">Slack thread</text>

<line x1="60" y1="490" x2="620" y2="490" stroke="#B4B2A9" stroke-width="0.2" stroke-dasharray="2 3"/>
<text class="ts" x="340" y="512" text-anchor="middle">核心：生成者（执行者）≠ 评估者（编排者）— Anthropic Harness Design</text>
<text class="ts" x="340" y="530" text-anchor="middle">频道内高层对话 · 实际工作基于文件 · 路由靠 @mention</text>

</svg>
